# "Claude here" (new-tab + menu): Claude in the current repo, no worktree. A tab config
# opens in $HOME, so command 1 cd's to the default repo (current if resolvable, else the
# most-recently-used one from recent-repos). Two commands so the cd lands as its own
# command and Warp samples the repo's folder before Claude starts (see claude_worktree
# .toml). If no repo is known, command 1 makes no cd and Claude just runs in $HOME.
name = "Claude · here"

[[panes]]
id = "main"
type = "terminal"
commands = [
  '{ d="$(~/.warp/bin/repo-default.sh)" && [ -n "$d" ] && cd "$d"; } || true',
  'claude',
]
