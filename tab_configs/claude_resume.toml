# Open Claude's interactive session picker in your last repo, from the new-tab (+) menu.
# Same as "Claude · here" but the final command is `claude --resume`, which lists past
# conversations for that working directory so you can choose one (vs `--continue`, which
# auto-picks the latest).
#
# A tab config opens in $HOME, so command 1 resolves the repo via repo-default.sh
# (current repo, else recent-repos[0]) and cd's there. Two commands on purpose (see
# claude_worktree.toml): the `cd` finishes first so Warp samples the repo's folder +
# branch at the command boundary, THEN Claude runs.
name = "Claude · resume"

[[panes]]
id = "main"
type = "terminal"
commands = [
  '{ d="$(~/.warp/bin/repo-default.sh)" && [ -n "$d" ] && cd "$d"; } || true',
  'claude --resume',
]
