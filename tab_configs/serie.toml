# "Serie · here" (new-tab + menu): open the serie commit-graph TUI in the current repo.
# Same repo resolution as claude_here / lazygit - command 1 cd's to the default repo
# (current if resolvable, else most-recently-used from recent-repos) as its own command
# so Warp samples the folder + branch, then serie renders that repo's commit graph.
# If no repo is known, serie opens in $HOME and reports there's no git repository.
name = "Serie · here"

[[panes]]
id = "main"
type = "terminal"
commands = [
  '{ d="$(~/.warp/bin/repo-default.sh)" && [ -n "$d" ] && cd "$d"; } || true',
  'serie',
]
