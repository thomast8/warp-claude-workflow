# "Serie · PR worktree" (new-tab + menu): pick an open PR (fzf over `gh pr list`),
# create/reuse a worktree on its head branch under <WARP_WORKTREES_DIR>/<repo>/pr<n>,
# then open serie there. Same machinery as claude_pr (pr-worktree.sh prints the worktree
# path; we cd + launch). A tab config opens in $HOME, so it defaults to your most-recent
# repo (or prompts); to target the repo you're in, run the picker from that repo's shell.
#
# Two commands on purpose (see claude_pr): the cd lands first so Warp samples the
# worktree's folder + branch, then serie renders. `--initial-selection head` puts the
# cursor on the PR branch tip instead of serie's default "latest commit by date".
name = "Serie · PR worktree"

[[panes]]
id = "main"
type = "terminal"
commands = [
  'wt="$(~/.warp/bin/pr-worktree.sh)" && cd "$wt"',
  'serie --initial-selection head',
]
